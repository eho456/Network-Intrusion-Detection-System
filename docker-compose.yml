
services:
  # Backend
  backend:
    build: ./backend 
    ports:
      - "8000:8000"  
    volumes:
      # Mount model and data 
      - ./src:/app/../src    
      - ./data:/app/../data  
    environment:
      - PYTHONUNBUFFERED=1     # Docker logs print statements

  # Frontend
  frontend:
    build: ./frontend  
    ports:
      - "5173:5173"
    depends_on:
      - backend              
    environment:
      - VITE_API_URL=http://localhost:8000